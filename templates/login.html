{% extends "base.html" %}

{% block title %}Login | AI Interview Room{% endblock %}

{% block content %}
<section class="view-section active auth-view-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-circle">🔐</div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Login to access your AI mock interview room and performance history.</p>
    </div>

    {% if error %}
      <div class="auth-alert-box">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="/login{% if next_url %}?next={{ next_url }}{% endif %}" id="loginForm" class="auth-form">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" value="{{ email|default('') }}" required autofocus>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="auth-options-row">
        <label class="remember-me-checkbox">
          <input type="checkbox" name="remember_me" checked>
          <span>Remember me</span>
        </label>
      </div>

      <div style="margin-top: 14px;">
        <button type="submit" class="btn-primary" id="loginSubmitBtn" style="width: 100%; padding: 16px;">
          <span>🔓 Login</span>
        </button>
      </div>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a href="/signup" class="auth-link">Create Account</a>
    </div>
  </div>
</section>
{% endblock %}
